<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakeibo - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex h-screen w-screen items-center justify-center font-sans antialiased text-slate-200 selection:bg-cyan-500 selection:text-white">

    <div class="absolute min-h-screen w-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-indigo-950 to-slate-900 opacity-80"></div>

    <div class="relative z-10 w-full max-w-md p-4">
        <div class="rounded-2xl border border-slate-800 bg-slate-950/40 p-8 shadow-2xl backdrop-blur-xl">
            
            <div class="mb-8 text-center">
                <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 shadow-lg shadow-cyan-500/20">
                    <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="mt-4 text-2xl font-bold tracking-tight text-white">Kakeibo</h1>
                <p class="mt-1 text-sm text-slate-400">アカウントにサインインしてください</p>
            </div>

            {% if form.errors %}
            <div class="mb-4 rounded-lg bg-red-500/10 border border-red-500/20 p-3 text-xs text-red-400">
                ユーザー名またはパスワードが正しくありません。
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label for="id_username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Username</label>
                    <div class="mt-1">
                        <input type="text" name="username" id="id_username" required
                            class="w-full rounded-lg border border-slate-800 bg-slate-900/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 transition-all focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20"
                            placeholder="ユーザー名を入力">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between">
                        <label for="id_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                    </div>
                    <div class="mt-1">
                        <input type="password" name="password" id="id_password" required
                            class="w-full rounded-lg border border-slate-800 bg-slate-900/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 transition-all focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                    class="group relative flex w-full justify-center rounded-lg bg-gradient-to-r from-cyan-500 to-indigo-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg transition-all hover:from-cyan-400 hover:to-indigo-400 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 active:scale-[0.98]">
                    Sign In
                </button>
            </form>

        </div>
    </div>

</body>
</html>
